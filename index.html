<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Rock Paper Scissors</h1>
    </div>

    <div class="round-status">
        <p>First to score 5 points wins.</p>
    </div>

    <div class="score-container">
        <div class="human-score-container">
            <div id="human-sign">
                <img id="human-sign-img" src="#" alt="#">
            </div>
            <p id="human-score">You: <span>0</span></p>
        </div>
        
        <div class="computer-score-container">
            <div id="computer-sign">
                <img id="computer-sign-img" src="#" alt="#">
            </div>
            <p id="computer-score">Computer: <span>0</span></p>
        </div>
    </div>

    <div class="container">
        <button id="rock" type="button">
            <div class="symbol">
                <img src="./icons/fist.png" alt="image-of-rock" width="100px">
            </div>
            Rock
        </button>
        <button id="paper" type="button">
            <div class="symbol">
                <img src="./icons/hand-paper.png" alt="image-of-paper" width="100px">
            </div>
            Paper
        </button>
        <button id="scissors" type="button">
            <div class="symbol">
                <img src="./icons/scissors.png" alt="image-of-scissor" width="100px">
            </div>
            Scissors
        </button>
    </div>


    <dialog id="dialog">
        <p id="game-result"></p>
        <button id="restart-game">Restart</button>
    </dialog>
</body>
</html>
